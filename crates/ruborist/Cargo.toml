[package]
name        = "utoo-ruborist"
version     = "0.1.0"
edition     = "2024"
description = "Rust arborist - dependency resolution core for utoo package manager"
license     = "MIT"

# tombi: format.rules.table-keys-order.disabled = true
[dependencies]
anyhow       = { workspace = true }
deno_semver  = "0.7"
futures      = "0.3"
parking_lot  = { workspace = true }
petgraph     = "0.6"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio-fs-ext = { workspace = true }
tokio-retry  = "0.3"
tracing      = { workspace = true }
# HTTP client - works on both native and WASM
reqwest      = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }

# Async runtime (works on both native and WASM with forked tokio)
[dependencies.tokio]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"  # For time in WASM
