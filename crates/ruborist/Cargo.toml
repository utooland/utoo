[package]
name        = "utoo-ruborist"
version     = "0.1.0"
edition     = "2024"
description = "Rust arborist - dependency resolution core for utoo package manager"
license     = "MIT"

# tombi: format.rules.table-keys-order.disabled = true
[dependencies]
anyhow       = { workspace = true }
bytes        = "1"
deno_semver  = "0.7"
dirs         = { workspace = true }
futures      = "0.3"
parking_lot  = { workspace = true }
petgraph     = "0.6"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = { workspace = true }
simd-json    = "0.17"
thiserror    = { workspace = true }
tokio-fs-ext = { workspace = true }
tokio-retry  = "0.3"
tracing      = { workspace = true }
# HTTP client - works on both native and WASM
reqwest      = { version = "0.12", default-features = false, features = [
  "http2",
  "json",
  "rustls-tls",
  "rustls-tls-native-roots",
  "socks"
] }
# Git clone (optional, native-only)
gix          = { workspace = true, features = [
  "blocking-http-transport-reqwest-rust-tls",
  "blocking-network-client",
], optional = true }
tempfile     = { workspace = true, optional = true }
# HTTP tarball extraction (optional, native-only — gated on `native-git` feature
# alongside git resolution since both share tempfile + blocking threadpool).
flate2       = { version = "1.0", optional = true }
tar          = { version = "0.4", optional = true }

# Async runtime (works on both native and WASM with forked tokio)
[dependencies.tokio]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

# Native-only dependencies (not compiled for WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"  # For time in WASM

[features]
default    = []
native-git = ["flate2", "gix", "tar", "tempfile"]
