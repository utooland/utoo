[package]
name        = "utoo-ruborist"
version     = "0.1.0"
edition     = "2024"
description = "Rust arborist - dependency resolution core for utoo package manager"
license     = "MIT"

# tombi: format.rules.table-keys-order.disabled = true
[dependencies]
anyhow       = { workspace = true }
bytes        = "1"
dashmap      = "6.1.0"
pathdiff     = { workspace = true }
deno_semver  = "0.7"
dirs         = { workspace = true }
futures      = "0.3"
parking_lot  = { workspace = true }
petgraph     = "0.6"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = { workspace = true }
simd-json    = "0.17"
thiserror    = { workspace = true }
tokio-fs-ext = { workspace = true }
tokio-retry  = "0.3"
tracing      = { workspace = true }
# HTTP client - works on both native and WASM
reqwest      = { version = "0.12", default-features = false, features = [
  "brotli",
  "gzip",
  "http2",
  "json",
  "rustls-tls",
  "rustls-tls-native-roots",
  "socks"
] }
# Shared URL-hash + staging helpers for native-only resolvers (git / http)
sha2         = { workspace = true, optional = true }
tempfile     = { workspace = true, optional = true }
# Git clone (gated on `native-git`)
gix          = { workspace = true, features = [
  "blocking-http-transport-reqwest-rust-tls",
  "blocking-network-client",
], optional = true }
# HTTP tarball extraction (gated on `http-tarball`)
# Uses libdeflater to match pm's extractor and avoid pulling a second gzip
# implementation (flate2) into the workspace.
libdeflater  = { version = "1.25", optional = true }
tar          = { version = "0.4", optional = true }

# Async runtime (works on both native and WASM with forked tokio)
[dependencies.tokio]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

# Native-only dependencies (not compiled for WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"  # For time in WASM

[features]
default      = []
# HTTP tarball resolver pre-extracts to <cache>/<name>/_http_<url_sha256>/
# during BFS, so install-phase hits a cache and never re-downloads. The
# URL-hash disambiguator also keeps HTTP tarball slots from colliding with
# registry tarball slots (<name>/<version>/).
http-tarball = ["libdeflater", "sha2", "tar", "tempfile"]
native-git   = ["gix", "tempfile"]
