[package]
name = "utoo-wasm"
version = "0.1.0"
edition = "2021"

description = "WASM bindings for utoo-pm & utoo-pack"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
reqwest = { version = "0.12.22" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
opfs = "0.1"
js-sys = "0.3"
petgraph = "0.6"
opfs-project = { workspace = true }
flate2 = "1.1.2"
tar = "0.4.44"
futures-util = "0.3.31"
futures = { workspace = true }
anyhow = { workspace = true, features = ["backtrace"] }
# pack-core = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = [
  "Navigator",
  "StorageManager",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemHandle",
  "FileSystemWritableFileStream",
  "FileSystemGetFileOptions",
  "FileSystemGetDirectoryOptions",
  "File",
  "console",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-threads",
  "--enable-nontrapping-float-to-int",
]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = true

# cargo +nightly  build -p utoo-wasm  --target wasm32-unknown-unknown -Z build-std=panic_abort,std
