[package]
name = "utoo-wasm"
version = "0.1.0"
edition = "2021"

description = "WASM bindings for utoo-pm & utoo-pack"

[lib]
crate-type = ["cdylib"]

[features]
default = ["utoo-pack"]
utoo-pack = [
    "turbo-rcstr",
    "turbo-tasks",
    "turbo-tasks-malloc",
    "turbo-tasks-backend",
    "pack-api",
]

[dependencies]
wasm-bindgen = { version = "0.2", features = ['serde-serialize'] }
wasm-bindgen-futures = "0.4"
reqwest = { version = "0.12.22" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
js-sys = "0.3"
petgraph = "0.6"
flate2 = "1.1.2"
tar = "0.4.44"
futures-util = "0.3.31"
futures = { workspace = true }
anyhow = { workspace = true, features = ["backtrace"] }
tracing = { workspace = true }
opfs-project = "0.1.1"
tokio = { workspace = true, features = ["rt"] }
wasmtimer = "0.4.2"
tracing-subscriber = { workspace = true }
tracing-web = "0.1.3"
pack-core = { workspace = true }
console_error_panic_hook = { version = "0.1.7" }

## turbpack specific - conditional on utoo-pack feature
turbo-rcstr = { workspace = true, optional = true }
turbo-tasks = { workspace = true, optional = true }
turbo-tasks-malloc = { workspace = true, optional = true }
turbo-tasks-backend = { workspace = true, optional = true }
pack-api = { workspace = true, optional = true }

[build-dependencies]
anyhow = { workspace = true }
turbo-tasks-build = { workspace = true }
