[package]
name        = "utoo-wasm"
version     = "0.1.0"
edition     = "2021"
description = "WASM bindings for utoo-pm & utoopack"

[lib]
crate-type = ["cdylib"]

# tombi: format.rules.table-keys-order.disabled = true
[dependencies]
anyhow                   = { workspace = true, features = ["backtrace"] }
console_error_panic_hook = { version = "0.1.7" }
deno_semver              = "0.7"
flate2                   = "1.1.5"
futures                  = { workspace = true }
js-sys                   = "0.3.83"
oneshot                  = "0.1.11"
opfs-project             = "0.2.11"
petgraph                 = "0.6"
reqwest                  = { version = "0.12.22", default-features = false, features = ["json"] }
rustc-hash               = { workspace = true }
serde                    = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen       = "0.6.5"
serde_json               = { workspace = true }
tar                      = "0.4.45"
tokio                    = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
tokio-fs-ext             = { workspace = true, features = ["opfs_offload", "opfs_tracing", "opfs_watch"] }
tracing                  = { workspace = true }
tracing-subscriber       = { workspace = true }
tracing-web              = "0.1.3"
utoo-ruborist            = { path = "../ruborist" }
wasm-bindgen             = "0.2.108"
wasm-bindgen-futures     = "0.4.58"
## turbpack specific - conditional on utoopack feature
pack-api                 = { workspace = true, default-features = false, features = ["worker_pool"], optional = true }
pack-core                = { workspace = true, default-features = false, optional = true }
parking_lot              = { workspace = true, features = ["nightly"] }
swc_core                 = { workspace = true, features = ["base", "ecma_ast"] }
turbo-rcstr              = { workspace = true, optional = true }
turbo-tasks              = { workspace = true, optional = true }
turbo-tasks-backend      = { workspace = true, optional = true }
turbo-tasks-fs           = { workspace = true, optional = true }
turbo-tasks-malloc       = { workspace = true, default-features = false, features = ["custom_allocator"] }
turbopack-core           = { workspace = true, optional = true }
turbopack-node           = { workspace = true, default-features = false, features = ["worker_pool"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom    = { version = "0.2", features = ["js"] }
# rand v0.10+ pulls in getrandom v0.4 which requires wasm_js on wasm32-unknown-unknown.
# Use a package alias so Cargo's feature unification propagates wasm_js to all v0.4 users.
getrandom-v4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[features]
default  = ["utoopack"]
utoopack = [
  "pack-api",
  "pack-core",
  "turbo-rcstr",
  "turbo-tasks",
  "turbo-tasks-backend",
  "turbo-tasks-fs",
  "turbopack-core",
  "turbopack-node",
]
