[package]
name = "pack-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
plugin = [
  "swc_core/plugin_transform_host_native",
  "turbopack-ecmascript-plugins/swc_ecma_transform_plugin",
]
test = ["turbopack-ecmascript-runtime/test", "turbopack-browser/test"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22.1"
qstring = "0.7.2"
serde = { workspace = true }
serde_json = { workspace = true }
mime_guess = "2.0.4"
indoc = { workspace = true }
tracing = { workspace = true }
dunce = { workspace = true }
pathdiff = { workspace = true }
rustc-hash = { workspace = true }
remove_console = { workspace = true }
urlencoding = { workspace = true }
modularize_imports = { workspace = true }
serde_path_to_error = { workspace = true }
swc_core = { workspace = true, features = [
  "base",
  "common_concurrent",
  "ecma_ast",
  "ecma_loader_lru",
  "ecma_loader_node",
  "ecma_minifier",
  "ecma_parser",
  "ecma_parser_typescript",
  "ecma_preset_env",
  "ecma_transforms",
  "ecma_transforms_optimization",
  "ecma_transforms_react",
  "ecma_transforms_typescript",
  "ecma_utils",
  "ecma_visit",
] }

turbo-esregex = { workspace = true }
turbo-rcstr = { workspace = true }
turbo-tasks = { workspace = true }
turbo-tasks-bytes = { workspace = true }
turbo-tasks-env = { workspace = true }
turbo-tasks-fetch = { workspace = true }
turbo-tasks-fs = { workspace = true }
turbo-tasks-hash = { workspace = true }
turbopack = { workspace = true }
turbopack-browser = { workspace = true }
turbopack-core = { workspace = true }
turbopack-ecmascript = { workspace = true }
turbopack-ecmascript-runtime = { workspace = true }
turbopack-node = { workspace = true }
turbopack-static = { workspace = true }
turbopack-image = { workspace = true }
turbopack-resolve = { workspace = true }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
turbopack-ecmascript-plugins = { workspace = true, default-features = true, features = [
  "transform_emotion",
] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
turbopack-ecmascript-plugins = { workspace = true, default-features = false, features = [
  "transform_emotion",
] }

[build-dependencies]
turbo-tasks-build = { workspace = true }

[lints]
workspace = true
