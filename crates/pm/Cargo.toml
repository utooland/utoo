[package]
name    = "utoo-pm"
version = "0.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "utoo"
path = "src/main.rs"

[dependencies]
anyhow            = { workspace = true }
async-compression = { version = "0.3", features = ["gzip", "tokio"] }
chrono            = { version = "0.4", features = ["serde"] }
clap              = { workspace = true }
colored           = "2.1"
dashmap           = "6.1.0"
deno_semver       = "0.7"
dirs              = "4.0"
flate2            = "1.0"
futures           = { workspace = true }
glob              = "0.3.1"
indicatif         = "0.17.8"
libc              = "0.2"
once_cell         = "1.19"
openssl           = { version = "0.10", features = ["vendored"] }
owo-colors        = { workspace = true }
petgraph          = "0.6"
regex             = "1.10"
reqwest           = { version = "0.11", features = ["gzip", "json", "stream", "trust-dns"] }
serde             = { workspace = true }
serde_json        = "1.0"
tar               = "0.4"
tempfile          = "3.15.0"
term_size         = "0.3"
tokio-retry       = "0.3"
tokio-tar         = "0.3.1"
tokio-util        = { version = "0.7", features = ["io"] }
toml              = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["full"] }

[[bench]]
harness = false
name    = "install_benchmark"
path    = "benches/deps_benchmark.rs"

[dev-dependencies]
criterion = { workspace = true }
mockito   = "1.7.0"
