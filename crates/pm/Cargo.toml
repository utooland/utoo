[package]
name        = "utoo-pm"
version     = "0.0.0"
edition     = "2024"
description = "Unified frontend toolchain — Rust-powered, npm-compatible package manager (utoo / ut)"
readme      = "../../README.md"
homepage    = "https://github.com/utooland/utoo"
repository  = "https://github.com/utooland/utoo"
license     = "MIT"
keywords    = ["frontend", "javascript", "npm", "package-manager", "toolchain"]
categories  = ["command-line-utilities", "development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "utoo"
path = "src/main.rs"

[dependencies]
anyhow             = { workspace = true }
async-trait        = { workspace = true }
atty               = "0.2"
base64             = "0.22"
bytes              = "1.11.0"
chrono             = { version = "0.4", features = ["serde"] }
clap               = { workspace = true }
clap_complete      = "4"
colored            = "2.1"
dashmap            = "6.1.0"
deno_semver        = "0.7"
dialoguer          = { version = "0.11", features = ["fuzzy-select"] }
dirs               = "4.0"
flate2             = "1.0"
futures            = { workspace = true }
glob               = "0.3.1"
globset            = "0.4"
ignore             = "0.4"
indicatif          = "0.17.8"
libc               = "0.2"
libdeflater        = "1.25"
once_cell          = "1.19"
open               = "5"
owo-colors         = { workspace = true }
pathdiff           = { workspace = true }
petgraph           = "0.6"
rayon              = { workspace = true }
regex              = "1.10"
reqwest            = { version = "0.12", default-features = false, features = [
  "gzip",
  "hickory-dns",
  "http2",
  "json",
  "rustls-tls",
  "socks",
  "stream",
] }
serde              = { workspace = true }
serde_json         = { version = "1.0", features = ["preserve_order"] }
serde_yaml         = { workspace = true }
sha1               = { workspace = true }
sha2               = { workspace = true }
strum              = { workspace = true }
tar                = "0.4"
tempfile           = "3.15.0"
term_size          = "0.3"
tokio-fs-ext       = { workspace = true }
tokio-retry        = "0.3"
tokio-util         = { version = "0.7" }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-appender   = "0.2"
tracing-subscriber = { workspace = true }
utoo-ruborist      = { path = "../ruborist", version = "0.1.0", features = ["http-tarball", "native-git"] }

[dev-dependencies]
mockito = "1.7.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Allocation-heavy workload (multi-MB JSON parses, graph build, per-file
# clone bookkeeping) — mimalloc measurably beats the system allocator here,
# matching what the pack crates already do via TurboMalloc. Resolved through
# the workspace [patch.crates-io] to the utooland fork.
mimalloc = "0.1"
tokio    = { workspace = true, features = ["full"] }
