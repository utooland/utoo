[package]
name = "utoo-cli"
version = "0.0.0-alpha.33"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "utoo"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
owo-colors = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
toml = { workspace = true }
colored = "2.1"
reqwest = { version = "0.11", features = ["json", "gzip", "trust-dns"] }
flate2 = "1.0"
tar = "0.4"
dirs = "4.0"
libc = "0.2"
clap = { workspace = true }
indicatif = "0.17.8"
once_cell = "1.19"
async-compression = { version = "0.3", features = ["tokio", "gzip"] }
tokio-tar = "0.3.1"
tokio-retry = "0.3"
tempfile = "3.15.0"
deno_semver = "0.7"
futures = { workspace = true }
glob = "0.3.1"
criterion = { workspace = true }
regex = "1.10"
anyhow = { workspace = true }
openssl = { version = "0.10", features = ["vendored"] }
petgraph = "0.6"
dashmap = "6.1.0"
chrono = { version = "0.4", features = ["serde"] }
term_size = "0.3"


[[bench]]
name = "install_benchmark"
harness = false
path = "benches/deps_benchmark.rs"

[dev-dependencies]
mockito = "1.7.0"
