[package]
name              = "pack-cli"
version           = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "pack-cli"
path = "src/main.rs"

[dependencies]
anyhow                = { workspace = true }
clap                  = { workspace = true, features = ["derive", "env"] }
dial9-tokio-telemetry = { version = "0.2.0", optional = true }
dunce                 = { workspace = true }
owo-colors            = { workspace = true }
pack-api              = { workspace = true, features = ["process_pool"] }
pack-core             = { workspace = true, features = ["process_pool"] }
rustc-hash            = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
swc_core              = { workspace = true }
tokio                 = { workspace = true }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true, features = ["chrono"] }
turbo-rcstr           = { workspace = true }
turbo-tasks           = { workspace = true }
turbo-tasks-backend   = { workspace = true }
turbo-tasks-malloc    = { workspace = true, default-features = false, features = ["custom_allocator"] }
turbopack-cli-utils   = { workspace = true }
turbopack-core        = { workspace = true }
turbopack-dev-server  = { workspace = true }
turbopack-node        = { workspace = true, default-features = false, features = ["process_pool"] }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
turbopack-trace-utils = { workspace = true }

[features]
dial9 = ["dial9-tokio-telemetry"]

[lints]
workspace = true
