[package]
name        = "pack-schema"
version     = "0.1.0"
edition     = "2024"
license     = "MIT"
description = "Schema generator for Mako configuration files"

[[bin]]
name = "pack-schema"
path = "src/main.rs"

[dependencies]
pack-core  = { path = "../pack-core" }
schemars   = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
