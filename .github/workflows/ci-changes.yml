name: Check for code changes

on:
  workflow_call:
    outputs:
      code:
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # API failures, truncated PR lists and unknown events keep checks enabled.
      code: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: filter
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files < 3000) ||
          (github.event_name == 'push' && github.event.before && github.event.before != '0000000000000000000000000000000000000000')
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        continue-on-error: true
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          ref: ${{ github.event_name == 'push' && github.sha || '' }}
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!docs/**'
