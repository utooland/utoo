name: format

on:
  push:
    branches: ["next"]
  pull_request:
    types: [opened, synchronize]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-10-27
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
