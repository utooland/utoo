name: utooweb-release

on:
  release:
    types: [published]

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'utooweb-v')
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Add SSH private keys for submodule repositories
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: |
            ${{ secrets.CI_SUBMODULE }}
      - name: Init git submodules
        run: git submodule update --init
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install
          npm install binaryen@123.0.0 --global
          cargo install -f wasm-bindgen-cli --version 0.2.104
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src --toolchain nightly-2025-10-27-x86_64-unknown-linux-gnu
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-10-27
      - name: Get version from release or use alpha version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/utooweb-v}" >> $GITHUB_OUTPUT
      - name: NPM Publish
        run: |
          # npm config set provenance true
          echo "${VERSION}" &&
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc &&

          npm version --workspace=@utoo/web "${VERSION}" &&
          npm publish --workspace=@utoo/web --access public
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
