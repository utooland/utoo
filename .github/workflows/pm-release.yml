name: utoopm-release

on:
  release:
    types: [published]

# on: [ push ]

jobs:
  build-and-publish-binary:
    if: startsWith(github.event.release.tag_name, 'utoo-')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_os: linux
            platform_cpu: x64
            container: ubuntu:20.04
          - os: macos-latest
            target: x86_64-apple-darwin
            platform_os: darwin
            platform_cpu: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_os: darwin
            platform_cpu: arm64

          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform_os: linux
            platform_cpu: arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_os: win32
            platform_cpu: x64

    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Install Linux Dependencies
        if: ${{ matrix.platform_os == 'linux' && matrix.platform_cpu == 'x64' }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update && apt-get install -y \
            build-essential \
            libc6-dev \
            libglib2.0-0 \
            curl \
            tzdata \
            pkg-config \
            libssl-dev \
            gnupg2 \
            software-properties-common \
            git
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update && apt-get install -y gh

      - uses: actions/checkout@v4

      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory /__w/utoo/utoo

      - name: Get version from release
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/utoo-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/utoo-v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Extracted version: $VERSION"
          else
            echo "VERSION=0.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Update Cargo.toml version
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" crates/pm/Cargo.toml
          rm crates/pm/Cargo.toml.bak

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-02-18
          targets: ${{ matrix.target }}

      # - name: Cache cargo
      #   uses: Swatinem/rust-cache@v2
      #   with:
      #     shared-key: pm-release-${{ matrix.target }}

      - name: Add cross-compilation target for x86_64 on macOS
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        run: rustup target add x86_64-apple-darwin

      - name: Add cross-compilation target for aarch64 on Linux
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --bin utoo --target ${{ matrix.target }}

      - name: Package Binaries  
        run: |  
          cd target/${{ matrix.target }}/release  
          if [ "${{ matrix.platform_os }}" = "win32" ]; then  
            tar -czf ../../../utoo-${{ matrix.platform_os }}-${{ matrix.platform_cpu }}.tar.gz utoo.exe  
          else  
            tar -czf ../../../utoo-${{ matrix.platform_os }}-${{ matrix.platform_cpu }}.tar.gz utoo  
          fi  
        shell: bash  
  
      - name: Verify npm package (dry-run)
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          cd vendor/scripts
          
          BINS=("utoo")
          for BIN in "${BINS[@]}"; do
            PACKAGE_NAME="$BIN"
            
            if [ "${{ matrix.platform_os }}" = "win32" ]; then
              BINARY_PATH="../../target/${{ matrix.target }}/release/${BIN}.exe"
            else
              BINARY_PATH="../../target/${{ matrix.target }}/release/${BIN}"
            fi
            
            ./npm-binary.sh "$PACKAGE_NAME" "$VERSION" "$BINARY_PATH" "${{ matrix.platform_os }}" "${{ matrix.platform_cpu }}"
          done
      
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwd
          ls -la
          gh release upload "${GITHUB_REF#refs/tags/}" \
            utoo-${{ matrix.platform_os }}-${{ matrix.platform_cpu }}.tar.gz --clobber

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish Binary Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -e
          cd vendor/scripts
          
          BINS=("utoo")
          for BIN in "${BINS[@]}"; do
            PACKAGE_NAME="$BIN"
            
            if [ "${{ matrix.platform_os }}" = "win32" ]; then
              BINARY_PATH="../../target/${{ matrix.target }}/release/${BIN}.exe"
            else
              BINARY_PATH="../../target/${{ matrix.target }}/release/${BIN}"
            fi
            
            ./npm-binary.sh "$PACKAGE_NAME" "$VERSION" "$BINARY_PATH" "${{ matrix.platform_os }}" "${{ matrix.platform_cpu }}"
          done

  publish-main:
    if: startsWith(github.event.release.tag_name, 'utoo-')
    needs: build-and-publish-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v3

      - name: Get version and tag from release
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/utoo-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/utoo-v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            # Determine npm tag based on GitHub Release prerelease flag
            if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
              echo "NPM_TAG=beta" >> $GITHUB_OUTPUT
              echo "GitHub Release marked as prerelease, will publish to 'beta' tag"
            else
              echo "NPM_TAG=latest" >> $GITHUB_OUTPUT
              echo "GitHub Release is stable, will publish to 'latest' tag"
            fi
          else
            echo "VERSION=0.0.0" >> $GITHUB_OUTPUT
            echo "NPM_TAG=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish Main utoo Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          NPM_TAG: ${{ steps.get_version.outputs.NPM_TAG }}
        run: |
          set -e
          cd vendor/scripts
          echo "Publishing utoo@$VERSION with npm tag: $NPM_TAG"
          ./npm-utoo.sh "$VERSION" "$NPM_TAG"
