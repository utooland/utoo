name: utoopm-bench-pcap

# Manual perf-debug only: captures tcpdump of the resolve phase per PM
# (linux only — sudo + raw sockets aren't available on macos GH runners).
# Self-contained — builds utoo inline so the workflow doesn't depend on
# pm-build's state.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to bench (under github.com/ant-design/<project>)'
        required: false
        default: 'ant-design'
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y build-essential curl pkg-config libssl-dev git
      - uses: actions/checkout@v4
      - name: Configure git safe directory
        run: git config --global --add safe.directory /__w/utoo/utoo
      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-02
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pm-bench-pcap-linux
      - name: Build utoo
        run: cargo build --release --bin utoo -p utoo-pm
      - name: Upload utoo binary
        uses: actions/upload-artifact@v4
        with:
          name: utoo-pcap-linux
          path: target/release/utoo
          retention-days: 1

  pcap-linux:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download utoo binary
        uses: actions/download-artifact@v4
        with:
          name: utoo-pcap-linux
          path: dist
      - name: Install utoo
        run: |
          chmod +x dist/utoo
          echo "$GITHUB_WORKSPACE/dist" >> $GITHUB_PATH
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pcap tools
        run: sudo apt-get update && sudo apt-get install -y tcpdump dnsutils hyperfine time
      - name: Capture pcap
        env:
          PROJECT: ${{ github.event.inputs.project || 'ant-design' }}
          REGISTRY: 'https://registry.npmjs.org'
        run: |
          chmod +x bench/pm-bench-pcap.sh
          bash bench/pm-bench-pcap.sh
      - name: Upload pcap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-bench-pcap
          path: /tmp/pm-bench-pcap
          retention-days: 7
