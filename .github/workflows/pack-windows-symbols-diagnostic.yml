name: Pack Windows optimized symbols diagnostic

on:
  push:
    branches: [zoomdong/diagnose-pack-windows-symbols-20261116]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build_symbols:
    name: Build optimized Windows native with symbols
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PACK_WINDOWS_BUILDER_IMAGE: utoo-pack-windows-builder:symbols
    steps:
      - name: Checkout the pinned ecosystem harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: utooland/utoo-ecosystem-ci
          ref: e95e8271c1683b0c26329a40ed1ebcd69887b6c5
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /usr/share/miniconda
          sudo docker image prune --all --force
      - name: Checkout the exact optimized source candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: utooland/utoo
          ref: e15628f3c19b33838ce323142d683f510c52a4ea
          path: candidate/utoo
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit@sha256:63db51c9b30208a7c2b1c40392c7ebb9ce2f85ba238a18a85420f8f5ea2d4684
      - name: Reuse the production Windows builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: candidate/utoo
          file: candidate/utoo/scripts/pack-windows-builder.Dockerfile
          load: true
          provenance: false
          tags: ${{ env.PACK_WINDOWS_BUILDER_IMAGE }}
          cache-from: type=gha,scope=ecosystem-windows-builder-v1
      - name: Initialize source submodules
        working-directory: candidate/utoo
        run: git submodule update --init --recursive --depth 1
      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Setup Utoo
        uses: utooland/setup-utoo@e63ce40ce5f7e9838c666a57479344e91c3a9795 # v1
        with:
          utoo-version: 1.1.8
          cache-store: true
      - name: Install source dependencies
        working-directory: candidate/utoo
        run: ut install
        env:
          HUSKY: '0'
      - name: Build with unchanged optimizations and PDB output
        shell: bash
        run: |
          set -euo pipefail
          binding_version=$(node -p 'require("./candidate/utoo/packages/pack/package.json").version')
          docker run --rm \
            --env CI=1 --env CARGO_INCREMENTAL=0 \
            --env CARGO_PROFILE_RELEASE_DEBUG=1 --env CARGO_PROFILE_RELEASE_STRIP=none \
            --env TARGET=x86_64-pc-windows-msvc --env npm_new_version="$binding_version" \
            --volume "$GITHUB_WORKSPACE/candidate/utoo:/build" --workdir /build \
            "$PACK_WINDOWS_BUILDER_IMAGE" /bin/bash /build/scripts/pack-windows-build.sh
          mkdir -p native-symbols
          find candidate/utoo/target/x86_64-pc-windows-msvc/release \
            -maxdepth 1 -type f -name '*.pdb' -exec cp '{}' native-symbols/ ';'
          test -n "$(find native-symbols -name '*.pdb' -print -quit)"
          cp candidate/utoo/packages/pack/src/pack.win32-x64-msvc.node native-symbols/
          sha256sum native-symbols/* > native-symbols/SHA256SUMS
      - name: Pack the symbol-enabled source candidate
        shell: bash
        run: |
          node scripts/prepare-candidate.mjs \
            --source candidate/utoo --out candidate-artifacts \
            --binding candidate/utoo/packages/pack/src/pack.win32-x64-msvc.node
      - name: Upload the matching native image and PDB
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-optimized-native-symbols
          path: native-symbols/
          if-no-files-found: error
          retention-days: 7
      - name: Upload candidate packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-symbols-candidate
          path: candidate-artifacts/
          if-no-files-found: error
          retention-days: 7

  diagnostic:
    needs: build_symbols
    name: Windows Umi (${{ matrix.variant }})
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [candidate]
    env:
      DIAGNOSTIC_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout diagnostic scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: diagnostics
          persist-credentials: false
      - name: Checkout the original ecosystem harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: utooland/utoo-ecosystem-ci
          ref: e95e8271c1683b0c26329a40ed1ebcd69887b6c5
          path: harness
          persist-credentials: false
      - name: Use the same Node version as the failed run
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Download the matching symbol-enabled candidate
        if: matrix.variant == 'candidate'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-symbols-candidate
          path: candidate-artifacts
      - name: Prepare and verify native probe input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-results native-input
          if [[ "$DIAGNOSTIC_VARIANT" == candidate ]]; then
            node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const metadata = JSON.parse(fs.readFileSync('candidate-artifacts/metadata.json', 'utf8'));
          assert.equal(metadata.commit, 'e15628f3c19b33838ce323142d683f510c52a4ea');
          for (const entry of Object.values(metadata.packages)) {
            const bytes = fs.readFileSync('candidate-artifacts/' + entry.file);
            assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), entry.sha256);
          }
          NODE
            tar -xzf candidate-artifacts/utoo-pack.tgz -C native-input
          else
            npm pack @utoo/pack-win32-x64-msvc@1.6.3 --ignore-scripts --pack-destination native-input
            tar -xzf native-input/utoo-pack-win32-x64-msvc-1.6.3.tgz -C native-input
          fi
      - name: Record direct native load exit status
        shell: bash
        run: |
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const name = process.env.DIAGNOSTIC_VARIANT === 'candidate'
            ? 'native-input/package/cjs/pack.win32-x64-msvc.node'
            : 'native-input/package/pack.win32-x64-msvc.node';
          const native = path.resolve(name);
          const code = `console.log('BEFORE_NATIVE_REQUIRE'); const binding = require(process.argv[1]); console.log('AFTER_NATIVE_REQUIRE', Object.keys(binding)); if (binding.getModuleReferencesVersion) console.log('MODULE_VERSION', binding.getModuleReferencesVersion());`;
          const result = spawnSync(process.execPath, ['-e', code, native], {
            encoding: 'utf8', timeout: 30_000,
          });
          const report = {
            variant: process.env.DIAGNOSTIC_VARIANT, native,
            sha256: crypto.createHash('sha256').update(fs.readFileSync(native)).digest('hex'),
            status: result.status, signal: result.signal,
            windowsCode: typeof result.status === 'number' ? '0x' + (result.status >>> 0).toString(16) : null,
            error: result.error?.stack, stdout: result.stdout, stderr: result.stderr,
            node: process.version, architecture: process.arch,
          };
          fs.writeFileSync('diagnostic-results/native-load.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Prepare Microsoft ProcDump for the Umi worker
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'Procdump.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'procdump'
          Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath $tools -Force
          $exe = Join-Path $tools 'procdump64.exe'
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'ProcDump must have a valid Microsoft signature'
          }
          $dumps = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-results/dumps'
          New-Item -ItemType Directory -Force $dumps | Out-Null
          "WIN_RELEASE_PROCDUMP=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "WIN_RELEASE_DUMP_DIR=$dumps" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run the pinned Umi suite with exit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          preload=$(node -p 'require("node:path").resolve("diagnostics/scripts/ci/windows-release-preload.cjs").replaceAll("\\", "/")')
          export NODE_OPTIONS="--max-old-space-size=6144 --require=$preload"
          if [[ "$DIAGNOSTIC_VARIANT" == candidate ]]; then
            pack_spec="$GITHUB_WORKSPACE/candidate-artifacts/utoo-pack.tgz"
            shared_spec="$GITHUB_WORKSPACE/candidate-artifacts/utoo-pack-shared.tgz"
            cli_spec="$GITHUB_WORKSPACE/candidate-artifacts/utoo-pack-cli.tgz"
          else
            pack_spec=1.6.3
            shared_spec=1.6.3
            cli_spec=1.6.3
          fi
          node harness/src/cli.mjs \
            --suite umi --ref 418cd35b267d3882e1fc8c277ecce9a5a370614a \
            --pack "$pack_spec" --pack-shared "$shared_spec" --pack-cli "$cli_spec" \
            --workspace "$GITHUB_WORKSPACE/workspace-$DIAGNOSTIC_VARIANT" \
            2>&1 | tee "diagnostic-results/umi-$DIAGNOSTIC_VARIANT.log"
      - name: Finish crash collection
        if: always()
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Process procdump64 -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          Get-ChildItem diagnostic-results -Recurse | Select-Object FullName, Length
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Id -eq 1000 -and $_.Message -match 'node.exe' } |
            Format-List TimeCreated, Id, Message |
            Out-File diagnostic-results/windows-application-errors.txt
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-symbols-diagnostic-${{ matrix.variant }}
          path: diagnostic-results/
          if-no-files-found: warn
          retention-days: 7

  analyze_dump:
    name: Analyze native crash dump
    needs: diagnostic
    if: always() && needs.diagnostic.result != 'cancelled'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-symbols-diagnostic-candidate
          path: diagnostic-results
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-symbols-candidate
          path: candidate-artifacts
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-optimized-native-symbols
          path: native-symbols
      - name: Analyze using CDB and the matching native image and PDB
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-image, analysis-results | Out-Null
          tar -xzf candidate-artifacts/utoo-pack.tgz -C native-image package/cjs/pack.win32-x64-msvc.node
          $native = 'native-image/package/cjs/pack.win32-x64-msvc.node'
          if ((Get-FileHash $native -Algorithm SHA256).Hash -ne (Get-FileHash native-symbols/pack.win32-x64-msvc.node -Algorithm SHA256).Hash) {
            throw 'Native image does not match the crashing candidate'
          }
          $cdb = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
            (Get-Command cdb.exe -ErrorAction SilentlyContinue).Source
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $cdb) {
            'CDB unavailable; preserve dumps for offline analysis.' | Out-File analysis-results/status.txt
            exit 0
          }
          $dumps = @(Get-ChildItem diagnostic-results -Recurse -Filter *.dmp)
          if ($dumps.Count -eq 0) {
            'No native crash dump was captured.' | Out-File analysis-results/status.txt
            exit 0
          }
          $images = "$(Resolve-Path native-image/package/cjs);$(Split-Path (Get-Command node).Source)"
          foreach ($dump in $dumps) {
            $log = Join-Path (Resolve-Path analysis-results) "$($dump.Name).cdb.txt"
            & $cdb -sins -y "$(Resolve-Path native-symbols)" -i $images -z $dump.FullName -logo $log -c '.reload /f; .exr -1; .ecxr; r; lmv a (@rip); ln @rip; kv 60; dps @rsp L80; lmf; ~* kv 10; q'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-symbolized-crash-analysis
          path: analysis-results/
          if-no-files-found: warn
          retention-days: 7
