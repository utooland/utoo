name: utoopack-ci

on:
  push:
    branches: ["next"]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  test:
    needs: changes
    if: needs.changes.outputs.pack == 'true'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            test: |
              cargo check -p pack-napi --features plugin --target aarch64-apple-darwin &&
              cargo test -p pack-tests --target aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
            test: |
              cargo check -p pack-napi --features plugin --target x86_64-apple-darwin &&
              cargo test -p pack-tests --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            test: |
              apt-get update &&
              rustup install nightly-2026-11-06 &&
              rustup default nightly-2026-11-06 &&
              rustup target add x86_64-unknown-linux-gnu &&
              cargo check -p pack-napi --features plugin --target x86_64-unknown-linux-gnu &&
              cargo test -p pack-tests --target x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            test: |
              set -ex &&
              rm /etc/apk/repositories &&
              echo "https://dl-cdn.alpinelinux.org/alpine/v3.21/main" >> /etc/apk/repositories &&
              echo "https://dl-cdn.alpinelinux.org/alpine/v3.21/community" >> /etc/apk/repositories &&
              apk update &&
              apk add --no-cache libc6-compat pkgconfig dav1d libdav1d dav1d-dev clang-static llvm-dev &&
              rustup install nightly-2026-11-06 &&
              rustup default nightly-2026-11-06 &&
              rustup target add x86_64-unknown-linux-musl &&
              export RUSTFLAGS='--cfg tokio_unstable -Zshare-generics=y -Zthreads=8 -Csymbol-mangling-version=v0 -Ctarget-feature=-crt-static' &&
              cargo check -p pack-napi --features plugin --target x86_64-unknown-linux-musl &&
              cargo test -p pack-tests --target x86_64-unknown-linux-musl
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            setup: sudo apt-get update && sudo apt-get install -y build-essential pkg-config clang llvm-dev libclang-dev
            test: |
              cargo check -p pack-napi --features plugin --target aarch64-unknown-linux-gnu &&
              cargo test -p pack-tests --target aarch64-unknown-linux-gnu
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            # This official image has an arm64 manifest; the napi-rs Alpine
            # image used by the x64 job is an x64 cross-compilation image.
            docker: rust:1.85-alpine3.21@sha256:4333721398de61f53ccbe53b0b855bcc4bb49e55828e8f652d7a8ac33dd0c118
            test: |
              set -ex &&
              apk add --no-cache build-base git nodejs npm libc6-compat pkgconfig dav1d libdav1d dav1d-dev clang-static clang-dev llvm-dev &&
              rustup install nightly-2026-11-06 &&
              rustup default nightly-2026-11-06 &&
              rustup target add aarch64-unknown-linux-musl &&
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=cc &&
              export RUSTFLAGS='--cfg tokio_unstable -Zshare-generics=y -Zthreads=8 -Csymbol-mangling-version=v0' &&
              cargo check -p pack-napi --features plugin --target aarch64-unknown-linux-musl &&
              cargo test -p pack-tests --target aarch64-unknown-linux-musl
          # swc_plugin_runner not supported on aarch64 windows now
          # - host: windows-latest
          #   target: aarch64-pc-windows-msvc
          #   test: |
          #     git config --system core.longpaths true &&
          #     rustup target add aarch64-pc-windows-msvc &&
          #     cargo test -p pack-tests
          # - host: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   test: |
          #     git config --system core.longpaths true &&
          #     cargo test -p pack-tests --target x86_64-pc-windows-msvc
    name: utoopack-ci-${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo docker image prune --all --force
      - name: Setup node
        uses: actions/setup-node@v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 22.14.0
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: nightly-2026-11-06
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        if: ${{ !matrix.settings.docker }}
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: pack-ci-${{ matrix.settings.target }}
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # Container Cargo uses /usr/local/cargo and /build/target rather than
      # the host toolchain's Cargo home, so cache its mounted paths explicitly.
      - name: Cache container cargo
        id: container-cache
        if: ${{ matrix.settings.docker }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .cargo-cache/git
            .cargo/registry
            target
            !target/**/incremental
          key: pack-ci-docker-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.settings.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', '.github/workflows/pack-ci.yml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            pack-ci-docker-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.settings.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', '.github/workflows/pack-ci.yml') }}-
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Setup Utoo
        uses: utooland/setup-utoo@v1

      - name: Clear install-node for musl builds
        if: ${{ contains(matrix.settings.target, 'musl') }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            delete pkg.engines['install-node'];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: utoo install
      - name: Setup node x86
        uses: actions/setup-node@v4
      - name: Verify NAPI release command
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        run: npm run artifacts --workspace=@utoo/pack -- --help
      - name: Test in docker
        if: ${{ matrix.settings.docker }}
        run: |
          cat <<'EOF' > test_script.sh
          ${{ matrix.settings.test }}
          EOF
          chmod +x test_script.sh
          docker run --rm \
            -e CARGO_INCREMENTAL \
            -v ${{ github.workspace }}/.cargo-cache/git:/usr/local/cargo/git \
            -v ${{ github.workspace }}/.cargo/registry:/usr/local/cargo/registry \
            -v ${{ github.workspace }}:/build \
            -w /build \
            ${{ matrix.settings.docker }} \
            /bin/sh /build/test_script.sh
      - name: Normalize container cache permissions
        if: ${{ always() && matrix.settings.docker }}
        run: |
          mkdir -p target .cargo-cache .cargo
          sudo chown -R "$(id -u):$(id -g)" target .cargo-cache .cargo
      - name: Save container cargo cache
        if: >-
          success() && matrix.settings.docker &&
          steps.container-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .cargo-cache/git
            .cargo/registry
            target
            !target/**/incremental
          key: ${{ steps.container-cache.outputs.cache-primary-key }}
      - name: Test
        run: ${{ matrix.settings.test }}
        if: ${{ !matrix.settings.docker }}
        shell: bash

  success:
    name: utoopack-ci-success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - test
    steps:
      - name: Check success
        run: |
          if [ "${{ needs.changes.result }}" != "success" ] || [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.test.result }}" == "cancelled" ]; then
            echo "Tests failed or were cancelled"
            exit 1
          else
            echo "Tests passed or were skipped"
          fi
