name: utoopack-ci

on:
  push:
    branches: ["next"]
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            test: |
              cargo test -p pack-tests --target aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
            test: |
              rustup target add x86_64-apple-darwin &&
              cargo test -p pack-tests --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            test: |
              cargo test -p pack-tests --target x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            test: |
              set -ex &&
              rm /etc/apk/repositories &&
              echo "https://dl-cdn.alpinelinux.org/alpine/v3.21/main" >> /etc/apk/repositories &&
              echo "https://dl-cdn.alpinelinux.org/alpine/v3.21/community" >> /etc/apk/repositories &&
              apk update &&
              apk add --no-cache libc6-compat pkgconfig dav1d libdav1d dav1d-dev clang-static llvm-dev &&
              rustup target add x86_64-unknown-linux-musl &&
              cargo test -p pack-tests --target x86_64-unknown-linux-musl
          # - host: ubuntu-latest
          #   target: aarch64-unknown-linux-gnu
          #   docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
          #   test: |
          #     rustup target add aarch64-unknown-linux-gnu &&
          #     cargo test -p pack-tests --target aarch64-unknown-linux-gnu
          # - host: ubuntu-latest
          #   target: aarch64-unknown-linux-musl
          #   docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          #   test: |
          #     set -ex &&
          #     rm /etc/apk/repositories &&
          #     echo "https://dl-cdn.alpinelinux.org/alpine/v3.21/main" >> /etc/apk/repositories &&
          #     echo "https://dl-cdn.alpinelinux.org/alpine/v3.21/community" >> /etc/apk/repositories &&
          #     apk update &&
          #     apk add --no-cache libc6-compat pkgconfig dav1d libdav1d dav1d-dev clang-static llvm-dev &&
          #     rustup target add aarch64-unknown-linux-musl &&
          #     cargo test -p pack-tests --target aarch64-unknown-linux-musl
          # swc_plugin_runner not supported on aarch64 windows now
          # - host: windows-latest
          #   target: aarch64-pc-windows-msvc
          #   test: |
          #     git config --system core.longpaths true &&
          #     rustup target add aarch64-pc-windows-msvc &&
          #     cargo test -p pack-tests
          # - host: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   test: |
          #     git config --system core.longpaths true &&
          #     cargo test -p pack-tests --target x86_64-pc-windows-msvc
    name: utoopack-ci-${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Add SSH private keys for submodule repositories
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: |
            ${{ secrets.CI_SUBMODULE }}
      - name: Init git submodules
        run: git submodule update --init --depth 1
      - name: Setup node
        uses: actions/setup-node@v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 20
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: nightly-2025-10-27
          targets: ${{ matrix.settings.target }}
      # - name: Cache cargo
      #   uses: Swatinem/rust-cache@v2
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install dependencies
        run: npm install
      - name: Setup node x86
        uses: actions/setup-node@v4
      - name: Test in docker
        uses: addnab/docker-run-action@v3
        if: ${{ matrix.settings.docker }}
        with:
          image: ${{ matrix.settings.docker }}
          options: "-v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index -v ${{ github.workspace }}:/build -w /build"
          run: ${{ matrix.settings.test }}
      - name: Test
        run: ${{ matrix.settings.test }}
        if: ${{ !matrix.settings.docker }}
        shell: bash
