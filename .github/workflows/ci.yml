name: utoo-ci

on: [pull_request]

env:
  CARGO_INCREMENTAL: 1
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  CARGO_BUILD_JOBS: 0

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed-crates: ${{ steps.detect.outputs.changed-crates }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false
    - name: Add SSH private keys for submodule repositories
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: |
          ${{ secrets.CI_SUBMODULE }}
    - name: Init git submodules
      run: git submodule update --init --recursive

    - name: Detect changes
      id: detect
      shell: bash
      run: |
        CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
        echo "Changed files:"
        echo "$CHANGED_FILES"

        CHANGED_CRATES=""
        while IFS= read -r file; do
          echo "Processing file: $file"
          if [[ $file =~ ^crates/([^/]+)/ ]]; then
            CRATE_DIR="${BASH_REMATCH[1]}"
            echo "Found crate directory: $CRATE_DIR"
            if [ -f "crates/$CRATE_DIR/Cargo.toml" ]; then
              echo "Found Cargo.toml for $CRATE_DIR"
              PACKAGE_NAME=$(grep -m 1 '^name = ' "crates/$CRATE_DIR/Cargo.toml" | sed 's/name = "\(.*\)"/\1/')
              echo "Package name: $PACKAGE_NAME"
              if [ -n "$PACKAGE_NAME" ]; then
                CHANGED_CRATES="$CHANGED_CRATES $PACKAGE_NAME"
                echo "Added to changed crates: $PACKAGE_NAME"
              fi
            else
              echo "No Cargo.toml found for $CRATE_DIR"
            fi
          fi
        done <<< "$CHANGED_FILES"

        CHANGED_CRATES=$(echo $CHANGED_CRATES | tr ' ' '\n' | sort -u | tr '\n' ' ')
        echo "Final changed crates: $CHANGED_CRATES"
        echo "changed-crates=$CHANGED_CRATES" >> $GITHUB_OUTPUT

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed-crates != ''
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: Add SSH private keys for submodule repositories
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: |
          ${{ secrets.CI_SUBMODULE }}

    - name: Init git submodules
      run: git submodule update --init --recursive

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          ${{ runner.os }}-cargo-

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: nightly-2025-06-04
        override: true
        components: rustfmt, clippy

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Check formatting
      uses: actions-rs/cargo@v1
      with:
        command: fmt
        toolchain: nightly-2025-06-04
        args: --all -- --check

    - name: Lint changed crates
      run: |
        CHANGED_CRATES="${{ needs.detect-changes.outputs.changed-crates }}"
        echo "Running clippy for changed crates: $CHANGED_CRATES"
        
        SPECIAL_CRATES=""
        REGULAR_CRATES=""
        
        for crate in $CHANGED_CRATES; do
          if [ "$crate" == "utoo_runtime" ]; then
            SPECIAL_CRATES="$SPECIAL_CRATES $crate"
          else
            REGULAR_CRATES="$REGULAR_CRATES $crate"
          fi
        done
        
        if [[ $SPECIAL_CRATES == *"utoo_runtime"* ]]; then
          echo "Running clippy for utoo_runtime..."
          cd crates/runtime && cargo clippy
          cd ../..
        fi
        
        if [ -n "$(echo $REGULAR_CRATES | xargs)" ]; then
          echo "Running clippy for regular crates: $REGULAR_CRATES"
          PACKAGE_ARGS=""
          for crate in $REGULAR_CRATES; do
            PACKAGE_ARGS="$PACKAGE_ARGS -p $crate"
          done
          cargo clippy $PACKAGE_ARGS
        fi

    - name: Test changed crates
      run: |
        CHANGED_CRATES="${{ needs.detect-changes.outputs.changed-crates }}"
        echo "Running tests for changed crates: $CHANGED_CRATES"
        
        SPECIAL_CRATES=""
        REGULAR_CRATES=""
        
        for crate in $CHANGED_CRATES; do
          if [ "$crate" == "utoo_runtime" ] || [ "$crate" == "pack-tests" ]; then
            SPECIAL_CRATES="$SPECIAL_CRATES $crate"
          else
            REGULAR_CRATES="$REGULAR_CRATES $crate"
          fi
        done
        
        for crate in $SPECIAL_CRATES; do
          if [ "$crate" == "utoo_runtime" ]; then
            echo "Testing utoo_runtime..."
            cd crates/runtime && cargo test
            cd ../..
          elif [ "$crate" == "pack-tests" ]; then
            echo "Testing pack-tests..."
            cd crates/pack-tests && cargo nextest run --no-capture
            cd ../..
          fi
        done
        
        if [ -n "$(echo $REGULAR_CRATES | xargs)" ]; then
          echo "Testing regular crates: $REGULAR_CRATES"
          PACKAGE_ARGS=""
          for crate in $REGULAR_CRATES; do
            PACKAGE_ARGS="$PACKAGE_ARGS -p $crate"
          done
          cargo test $PACKAGE_ARGS
        fi

