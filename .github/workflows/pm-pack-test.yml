name: utoopm-pack-test

on:
  push:
    branches: ["pack-test-*"]

permissions:
  contents: read

jobs:
  build-and-pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_os: linux
            platform_cpu: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_os: darwin
            platform_cpu: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_os: win32
            platform_cpu: x64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-02-18
          targets: ${{ matrix.target }}

      - name: Build utoo-pm
        run: cargo build --release --target ${{ matrix.target }} --bin utoo -p utoo-pm

      - name: Pack npm tgz
        run: |
          VERSION="0.0.0-pack-test-$(git rev-parse --short HEAD)"
          WORK_DIR=$(mktemp -d)

          # Build platform-specific binary package
          mkdir -p "$WORK_DIR/binary/bin"
          if [ "${{ matrix.platform_os }}" = "win32" ]; then
            cp "target/${{ matrix.target }}/release/utoo.exe" "$WORK_DIR/binary/bin/utoo"
          else
            cp "target/${{ matrix.target }}/release/utoo" "$WORK_DIR/binary/bin/utoo"
            chmod +x "$WORK_DIR/binary/bin/utoo"
          fi

          cat > "$WORK_DIR/binary/package.json" << BPKG
          {
            "name": "@utoo/utoo-${{ matrix.platform_os }}-${{ matrix.platform_cpu }}",
            "version": "$VERSION",
            "os": ["${{ matrix.platform_os }}"],
            "cpu": ["${{ matrix.platform_cpu }}"],
            "bin": { "utoo": "bin/utoo" }
          }
          BPKG

          cd "$WORK_DIR/binary"
          npm pack
          cp *.tgz "$GITHUB_WORKSPACE/utoo-binary-${{ matrix.platform_os }}-${{ matrix.platform_cpu }}.tgz"

          # Build main utoo package
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$WORK_DIR/main/bin"

          # Render template
          cat vendor/templates/utoo.package.json.template | sed "s/{{version}}/$VERSION/g" > "$WORK_DIR/main/package.json"
          cp vendor/templates/postinstall.utoo.sh.template "$WORK_DIR/main/postinstall.sh"
          chmod +x "$WORK_DIR/main/postinstall.sh"
          cp README.md "$WORK_DIR/main/README.md"

          # Placeholder binaries
          for binary in utoo ut; do
            cat > "$WORK_DIR/main/bin/$binary" << 'PLACEHOLDER'
          #!/bin/sh
          echo "This is a placeholder binary. The actual binary will be installed via postinstall script."
          exit 1
          PLACEHOLDER
            chmod +x "$WORK_DIR/main/bin/$binary"
            cat > "$WORK_DIR/main/bin/$binary.cmd" << 'CMDPLACEHOLDER'
          @echo off
          echo This is a placeholder binary for %~n0. The actual binary will be installed via postinstall script.
          exit /b 1
          CMDPLACEHOLDER
          done

          # utx
          echo '#!/bin/sh
          utoo x "$@"' > "$WORK_DIR/main/bin/utx"
          chmod +x "$WORK_DIR/main/bin/utx"
          echo '@echo off
          utoo x %*' > "$WORK_DIR/main/bin/utx.cmd"

          cd "$WORK_DIR/main"
          npm pack
          cp *.tgz "$GITHUB_WORKSPACE/utoo-main.tgz"

          echo "Packed binary: utoo-binary-${{ matrix.platform_os }}-${{ matrix.platform_cpu }}.tgz"
          echo "Packed main: utoo-main.tgz"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utoo-tgz-${{ matrix.platform_os }}-${{ matrix.platform_cpu }}
          path: |
            utoo-binary-*.tgz
            utoo-main.tgz
