name: utoopm-pack-test

on:
  push:
    branches: ["pack-test-*"]

permissions:
  contents: read

jobs:
  egg-windows-e2e:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1

      - name: Disable Windows Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-02-18
          targets: x86_64-pc-windows-msvc

      - name: Build utoo-pm
        run: cargo build --release --target x86_64-pc-windows-msvc --bin utoo -p utoo-pm

      - name: Setup utoo in PATH
        shell: bash
        run: |
          BIN_DIR="$GITHUB_WORKSPACE/target/x86_64-pc-windows-msvc/release"
          # Create utoo.exe and ut.exe
          cp "$BIN_DIR/utoo.exe" "$BIN_DIR/ut.exe"
          echo "$BIN_DIR" >> $GITHUB_PATH
          echo "utoo binary: $(ls -la $BIN_DIR/utoo.exe)"

      - name: Verify utoo
        run: |
          utoo --version
          ut --version

      - name: Start Redis (Windows via Memurai)
        shell: pwsh
        run: |
          choco install -y memurai-developer.install
          $svc = Get-Service -Name Memurai -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -ne 'Running') {
            Start-Service -Name Memurai -ErrorAction Stop
            $svc.WaitForStatus('Running', '00:00:20')
          }

      - name: Start MySQL (Windows)
        shell: pwsh
        run: |
          choco install -y mysql
          refreshenv
          & mysql -uroot -e "CREATE DATABASE IF NOT EXISTS test;"

      - name: Clone eggjs
        run: |
          git clone --branch chore-ut-ci --single-branch --depth 1 https://github.com/eggjs/egg.git D:/a/egg/egg

      - name: Install egg dependencies
        working-directory: D:/a/egg/egg
        run: utoo install --ignore-scripts

      - name: Check node_modules/.bin
        working-directory: D:/a/egg/egg
        run: |
          echo "=== node_modules/.bin ==="
          ls node_modules/.bin/ | head -20
          echo "=== @rolldown ==="
          ls node_modules/@rolldown/ 2>/dev/null || echo "no @rolldown"
          echo "=== vitest ==="
          ls node_modules/.bin/vitest* 2>/dev/null || echo "no vitest bin"

      - name: Check .cmd shims
        working-directory: D:/a/egg/egg
        run: |
          echo "=== .cmd files in node_modules/.bin ==="
          ls node_modules/.bin/*.cmd 2>/dev/null | head -10 || echo "no .cmd files"
          echo "=== tsdown files ==="
          ls -la node_modules/.bin/tsdown* 2>/dev/null || echo "no tsdown"

      - name: Build egg-bin
        working-directory: D:/a/egg/egg
        run: utoo build -- --workspace ./tools/egg-bin

      - name: Run egg tests (shard 1/3)
        working-directory: D:/a/egg/egg
        run: utoo test --shard=1/3
        continue-on-error: true

      # ant-design-x: install + build
      - name: Clone ant-design-x
        run: git clone --branch next --single-branch --depth 1 https://github.com/ant-design/x.git D:/a/antd-x

      - name: Install ant-design-x
        working-directory: D:/a/antd-x
        run: utoo install --ignore-scripts

      - name: Build ant-design-x
        working-directory: D:/a/antd-x
        run: utoo run build
        continue-on-error: true

      # ant-design: install + build
      - name: Clone ant-design
        run: git clone --branch master --single-branch --depth 1 https://github.com/ant-design/ant-design.git D:/a/antd

      - name: Install ant-design
        working-directory: D:/a/antd
        run: utoo install --ignore-scripts

      - name: Build ant-design
        working-directory: D:/a/antd
        run: utoo run build
        continue-on-error: true
