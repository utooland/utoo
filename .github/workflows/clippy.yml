name: clippy

on:
  push:
    branches: ["next"]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  clippy:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-11-06
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: clippy-dev-${{ runner.arch }}
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings --no-deps
