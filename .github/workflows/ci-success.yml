name: CI Success Aggregator

on:
  workflow_run:
    workflows: 
      - "utoopm-ci"
      - "utoopm-e2e"
      - "utoopack-ci"
      - "utoopack-integration"
      - "utooweb-ci"
    types:
      - completed

jobs:
  all-success:
    name: all-ci-success
    runs-on: ubuntu-latest
    steps:
      - name: Check trigger workflows success
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" == "failure" ] || [ "${{ github.event.workflow_run.conclusion }}" == "cancelled" ]; then
            echo "Workflow ${{ github.event.workflow_run.name }} failed or was cancelled."
            exit 1
          else
            echo "Workflow ${{ github.event.workflow_run.name }} succeeded or was skipped."
          fi
