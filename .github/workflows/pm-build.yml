          BENCH_COLD_RUNS=${{ github.event.inputs.cold_runs || '3' }} \
          BENCH_WARM_RUNS=${{ github.event.inputs.warm_runs || '3' }} \
          bash e2e/pm-bench.sh ${{ github.event.inputs.registry || 'both' }} ${{ steps.pm.outputs.list }}

  # ============================================================
  # PM-BENCH-PCAP (manual perf-debug only)
  # workflow_dispatch with target=pm-bench-pcap. Captures tcpdump
  # of the resolve phase per PM (linux only — sudo + raw sockets).
  # ============================================================

  pm-bench-pcap-linux:
    needs: [build-linux]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pm-bench-pcap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download utoo binary
        uses: actions/download-artifact@v4
        with:
          name: utoo-linux-x64
          path: dist
      - name: Install utoo
        run: |
          chmod +x dist/utoo
          echo "$GITHUB_WORKSPACE/dist" >> $GITHUB_PATH
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pcap tools
        run: sudo apt-get update && sudo apt-get install -y tcpdump dnsutils hyperfine time
      - name: Capture pcap
        env:
          PROJECT: ${{ github.event.inputs.project || 'ant-design' }}
          REGISTRY: 'https://registry.npmjs.org'
        run: |
          chmod +x e2e/pm-bench-pcap.sh
          bash e2e/pm-bench-pcap.sh
      - name: Upload pcap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-bench-pcap
          path: /tmp/pm-bench-pcap
          retention-days: 7
