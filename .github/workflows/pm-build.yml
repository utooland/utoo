name: utoopm-build

# Build-only workflow. Builds `utoo` once per target and uploads each as
# an artifact. Downstream workflows (pm-e2e, pm-bench-phases, pm-bench,
# pm-bench-pcap) trigger on this workflow's completion via `workflow_run`
# and download the artifacts they need — so each target's
# `cargo build --release` runs at most once per commit.
#
# Triggers:
#   push to next/e2e-pm — only when commit msg contains `(pm`
#   pull_request — only when title contains `(pm`, OR labeled `benchmark`
#   workflow_dispatch — always builds linux + mac arm64 (skips mac x64 +
#     windows since they only feed e2e and dispatch is for bench/pcap)
on:
  push:
    branches: ["next", "e2e-pm"]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # Per-target build jobs. Gates are unions of every downstream
  # consumer (e2e, bench-phases, pm-bench, pm-bench-pcap). Linux +
  # mac-arm64 have the broadest set of consumers; mac-x64 and
  # windows only feed e2e (strict `(pm)` scope).
  # ============================================================

  build-linux:
    if: >
      (github.event_name == 'push' && contains(github.event.head_commit.message, '(pm')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '(pm')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'benchmark') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install dependencies
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        # Short per-apt timeouts: on GHA runners that can't route to
        # archive/security.ubuntu.com, apt otherwise sits in 90s × 8-IP SYN
        # timeouts. Bail after 60s on the default mirror, swap to the
        # Fastly-backed kernel.org mirror, and retry once.
        run: |
          install_pkgs() {
            timeout 60 apt-get update \
              && timeout 60 apt-get install -y build-essential curl pkg-config git
          }
          install_pkgs && exit 0
          echo "apt default mirror failed/timed out, falling back to mirrors.edge.kernel.org"
          dpkg --configure -a || true
          sed -i 's|http://archive\.ubuntu\.com|http://mirrors.edge.kernel.org|g; s|http://security\.ubuntu\.com|http://mirrors.edge.kernel.org|g' /etc/apt/sources.list
          install_pkgs
      - uses: actions/checkout@v4
      - name: Configure git safe directory
        run: git config --global --add safe.directory /__w/utoo/utoo
      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-02
          targets: x86_64-unknown-linux-gnu
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pm-build-linux
      - name: Build utoo-pm
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin utoo -p utoo-pm
      - name: Upload utoo binary
        uses: actions/upload-artifact@v4
        with:
          name: utoo-linux-x64
          path: target/x86_64-unknown-linux-gnu/release/utoo
          retention-days: 1

  build-mac-arm64:
    if: >
      (github.event_name == 'push' && contains(github.event.head_commit.message, '(pm')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '(pm')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'benchmark') ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-02
          targets: aarch64-apple-darwin
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pm-build-mac-arm64
      - name: Build utoo-pm
        run: cargo build --release --target aarch64-apple-darwin --bin utoo -p utoo-pm
      - name: Upload utoo binary
        uses: actions/upload-artifact@v4
        with:
          name: utoo-mac-arm64
          path: target/aarch64-apple-darwin/release/utoo
          retention-days: 1

  build-mac-x64:
    # Only feeds e2e-mac-x64 — strict `(pm)` scope, no bench consumers.
    # Cross-compiled on macos-latest (arm64 host).
    if: >
      (github.event_name == 'push' && contains(github.event.head_commit.message, '(pm)')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '(pm)'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-02
          targets: x86_64-apple-darwin
      - name: Add cross-compilation target
        run: rustup target add x86_64-apple-darwin
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pm-build-mac-x64
      - name: Build utoo-pm
        run: cargo build --release --target x86_64-apple-darwin --bin utoo -p utoo-pm
      - name: Upload utoo binary
        uses: actions/upload-artifact@v4
        with:
          name: utoo-mac-x64
          path: target/x86_64-apple-darwin/release/utoo
          retention-days: 1

  build-windows:
    # Only feeds e2e-windows — strict `(pm)` scope.
    if: >
      (github.event_name == 'push' && contains(github.event.head_commit.message, '(pm)')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '(pm)'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable Windows Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-02
          targets: x86_64-pc-windows-msvc
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pm-build-windows
      - name: Build utoo-pm
        run: cargo build --release --target x86_64-pc-windows-msvc --bin utoo -p utoo-pm
      - name: Upload utoo binary
        uses: actions/upload-artifact@v4
        with:
          name: utoo-windows-x64
          path: target/x86_64-pc-windows-msvc/release/utoo.exe
          retention-days: 1

  # Always-runs aggregator so this workflow reports a definite check
  # even on PRs where every build was gated out. Downstream workflows
  # use `workflow_run` and react to this run's conclusion.
  build-success:
    name: utoopm-build-success
    runs-on: ubuntu-latest
    if: always()
    needs: [build-linux, build-mac-arm64, build-mac-x64, build-windows]
    steps:
      - name: Check builds
        run: |
          for result in \
            "${{ needs.build-linux.result }}" \
            "${{ needs.build-mac-arm64.result }}" \
            "${{ needs.build-mac-x64.result }}" \
            "${{ needs.build-windows.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Build failed or was cancelled"
              exit 1
            fi
          done
          echo "Builds passed or were skipped"
