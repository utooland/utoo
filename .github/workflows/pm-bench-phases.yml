name: utoopm-benchmark-phases

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to benchmark (under github.com/ant-design/<project>)'
        required: false
        default: 'ant-design'
        type: string
      registry:
        description: 'Registry URL'
        required: false
        default: 'https://registry.npmjs.org'
        type: string
      runs:
        description: 'Runs per phase'
        required: false
        default: '3'
        type: string
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    # Mirrors `pack-perf.yml` auto-trigger pattern: only run on
    # PRs / pushes whose title or commit message references the pm
    # scope. Manual workflow_dispatch always runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '(pm')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '(pm'))
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y build-essential curl pkg-config libssl-dev git
      - uses: actions/checkout@v4
      - name: Configure git safe directory
        run: git config --global --add safe.directory /__w/utoo/utoo
      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-02
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pm-bench-linux
      - name: Build current branch utoo + manifest-bench
        run: |
          cargo build --release --bin utoo -p utoo-pm
          cargo build --release -p manifest-bench
      - name: Upload utoo binary
        uses: actions/upload-artifact@v4
        with:
          name: utoo-linux-bench-phases
          path: target/release/utoo
          retention-days: 1
      - name: Upload manifest-bench binary
        uses: actions/upload-artifact@v4
        with:
          name: manifest-bench-linux
          path: target/release/manifest-bench
          retention-days: 1

  bench:
    needs: [build-linux]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '(pm')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '(pm'))
    runs-on: ubuntu-latest
    # Comment-writing on PRs needs `pull-requests: write`. Other tokens
    # default to read-only on this workflow's events. Granular instead
    # of `write-all` to keep the workflow's blast radius minimal.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download utoo binary
        uses: actions/download-artifact@v4
        with:
          name: utoo-linux-bench-phases
          path: dist
      - name: Download manifest-bench binary
        uses: actions/download-artifact@v4
        with:
          name: manifest-bench-linux
          path: dist
      - name: Install utoo
        run: |
          chmod +x dist/utoo dist/manifest-bench
          echo "$GITHUB_WORKSPACE/dist" >> $GITHUB_PATH
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install hyperfine, GNU time, tcpdump and dnsutils
        run: sudo apt-get update && sudo apt-get install -y hyperfine time tcpdump dnsutils
      - name: Verify tools
        run: |
          hyperfine --version
          utoo --version
          bun --version
      - name: Run phase-isolated benchmark
        env:
          PROJECT: ${{ github.event.inputs.project || 'ant-design' }}
          REGISTRY: ${{ github.event.inputs.registry || 'https://registry.npmjs.org' }}
          BENCH_RUNS: ${{ github.event.inputs.runs || '3' }}
          PM_LIST: 'utoo,bun'
        run: |
          chmod +x e2e/pm-bench-phases.sh
          # Capture full output to a file so the PR comment step can
          # extract the per-phase summary tables. `tee` keeps live
          # progress visible in the workflow log.
          mkdir -p /tmp/pm-bench-output
          bash e2e/pm-bench-phases.sh 2>&1 | tee /tmp/pm-bench-output/bench-phases.log

      - name: Standalone manifest-bench (HTTP-only fetch sweep)
        env:
          REGISTRY: ${{ github.event.inputs.registry || 'https://registry.npmjs.org' }}
          PROJECT: ${{ github.event.inputs.project || 'ant-design' }}
        run: |
          set -eu
          # Generate a project lockfile to source the manifest names from.
          # Use bun (which we already have) to do a quick lockfile-only
          # install so manifest-bench has a real workload to fire against.
          PROJECT_DIR="/tmp/pm-bench/$PROJECT"
          if [ ! -d "$PROJECT_DIR" ]; then
            mkdir -p /tmp/pm-bench
            git clone --depth 1 "https://github.com/ant-design/$PROJECT" "$PROJECT_DIR"
          fi
          cd "$PROJECT_DIR"
          if [ ! -f package-lock.json ]; then
            echo "==> generating lockfile via utoo"
            utoo deps --registry "$REGISTRY" || true
          fi
          ls -la package-lock.json || { echo "no lockfile, skip"; exit 0; }

          echo
          echo "============================================================"
          echo "manifest-bench: HTTP-only fetch (no parse, no resolver)"
          echo "  Goal: isolate reqwest/rustls/tokio behaviour from"
          echo "  ruborist's resolver pipeline. Same numbers (wall, busy,"
          echo "  avg_conc, p50/p95/max) as ruborist's Preload HTTP diag."
          echo "============================================================"
          for CAP in 32 64 96 128 192 256; do
            echo
            echo "--- concurrency=$CAP, h1, full manifest, default UA ---"
            manifest-bench --lockfile package-lock.json --registry "$REGISTRY" \
              --concurrency "$CAP" --reps 2 --http1-only || true
          done

          echo
          echo "--- concurrency=128, h2 negotiate, full manifest, default UA ---"
          manifest-bench --lockfile package-lock.json --registry "$REGISTRY" \
            --concurrency 128 --reps 2 || true

          echo
          echo "--- concurrency=128, h1, single-version endpoint ---"
          manifest-bench --lockfile package-lock.json --registry "$REGISTRY" \
            --concurrency 128 --reps 2 --http1-only --single-version || true

          echo
          echo "--- concurrency=128, h1, UA=Bun/1.2.21 ---"
          manifest-bench --lockfile package-lock.json --registry "$REGISTRY" \
            --concurrency 128 --reps 2 --http1-only --user-agent "Bun/1.2.21" || true

      - name: Capture pcap (resolve phase, single run per PM)
        env:
          PROJECT: ${{ github.event.inputs.project || 'ant-design' }}
          REGISTRY: ${{ github.event.inputs.registry || 'https://registry.npmjs.org' }}
        run: |
          chmod +x e2e/pm-bench-pcap.sh
          bash e2e/pm-bench-pcap.sh

      - name: Upload pcap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-bench-pcap
          path: /tmp/pm-bench-pcap
          retention-days: 3

      # Build the comment body from the bench output. Strips ANSI escape
      # codes and pulls out the `## p<N>_<name>` summary tables; bun vs
      # utoo wall / RSS / IO / context-switch / network / cache /
      # lockfile rows are wrapped as fenced blocks for readability.
      - name: Build PR comment body
        if: always()
        run: |
          set -eu
          mkdir -p /tmp/pm-bench-output
          OUT=/tmp/pm-bench-output/pr_comment.md
          LOG=/tmp/pm-bench-output/bench-phases.log
          if [ ! -f "$LOG" ]; then
            echo "_No bench output produced — see [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._" > "$OUT"
            exit 0
          fi
          # Strip ANSI escapes
          CLEANED=$(mktemp)
          sed -E 's/\x1B\[[0-9;]*[a-zA-Z]//g' "$LOG" > "$CLEANED"

          SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "## 📊 pm-bench-phases · \`$SHA\`"
            echo ""
            echo "[Workflow run]($RUN_URL) — ant-design / npmjs.org / ubuntu-latest"
            echo ""
          } > "$OUT"

          # Extract each `## p<N>_<name>` section (up to but not including
          # the next `## ` or EOF) and wrap as code fence.
          awk '
            /^## p[0-9]+_[a-z0-9_]+/ {
              if (in_section) print "```\n";
              in_section = 1;
              print "```";
              print $0;
              next;
            }
            /^## / && in_section {
              print "```\n";
              in_section = 0;
            }
            in_section { print }
            END { if (in_section) print "```" }
          ' "$CLEANED" >> "$OUT"

      # Find the PR number that owns this run. On `pull_request` events
      # the number is on the event payload directly; on `push` events
      # we look it up by branch name (then by commit SHA as a fallback).
      # Mirrors pack-perf.yml so behaviour stays consistent across the
      # two perf workflows.
      - name: Find Current PR
        id: findPr
        if: always()
        run: |
          PR_NUMBER=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number' || true)
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
              PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --state open --json number --jq '.[0].number' || true)
            fi
          fi
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Post PR Comment
        if: always() && steps.findPr.outputs.number
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pm-bench-phases-report
          path: /tmp/pm-bench-output/pr_comment.md
          number: ${{ steps.findPr.outputs.number }}
          recreate: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
