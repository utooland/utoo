name: utoopm-benchmark-phases

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to benchmark (under github.com/ant-design/<project>)'
        required: false
        default: 'ant-design'
        type: string
      runs:
        description: 'Runs per phase'
        required: false
        default: '3'
        type: string
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build manifest-bench only — `utoo` itself is built by `pm-e2e.yml`'s
  # `build-linux-x64` job (linux artifact `utoo-linux-x64`) and the
  # `bench` job below downloads it from there. We avoid the duplicate
  # cargo build of utoo across the two workflows.
  #
  # `utoo-pm` builds for mac inside the bench job itself (pm-e2e
  # builds mac in its e2e matrix but doesn't upload an artifact for it).
  build-manifest-bench:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '(pm')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '(pm'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-02
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pm-bench-${{ matrix.platform }}
      - name: Build manifest-bench
        run: cargo build --release -p manifest-bench
      # On mac we also need utoo here — pm-e2e builds it for mac in
      # its e2e job but doesn't upload. On linux we download utoo from
      # pm-e2e instead.
      - name: Build utoo (mac only)
        if: matrix.platform == 'mac'
        run: cargo build --release --bin utoo -p utoo-pm
      - name: Upload manifest-bench binary
        uses: actions/upload-artifact@v4
        with:
          name: manifest-bench-${{ matrix.platform }}
          path: target/release/manifest-bench
          retention-days: 1
      - name: Upload utoo binary (mac only)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: utoo-mac-bench-phases
          path: target/release/utoo
          retention-days: 1

  bench:
    # Wait for both manifest-bench (this workflow) and pm-e2e's linux
    # build (separate workflow) to finish. Linux uses pm-e2e's
    # `utoo-linux-x64` artifact downloaded from the same commit's
    # pm-e2e run.
    needs: [build-manifest-bench]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '(pm')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '(pm'))
    strategy:
      # Don't cancel mac if linux fails (or vice versa) — each platform's
      # comment is independent and useful on its own.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    # `pull-requests: write` for sticky comment posting.
    # `actions: read` for `gh run list` to find pm-e2e's run id and
    #   for `download-artifact` cross-run via run-id.
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Linux: download utoo from pm-e2e's `build-linux-x64` job in
      # the matching workflow run for this commit/PR. Avoids building
      # utoo twice (once in pm-e2e, once here).
      - name: Resolve pm-e2e run id (linux only)
        if: matrix.platform == 'linux'
        id: pme2e
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Find the most recent pm-e2e run for this commit. pm-e2e
          # triggers on the same `(pm` scope so it should exist for
          # any commit that reaches us.
          RUN_ID=$(gh run list \
            --workflow utoopm-e2e \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --limit 1 \
            --json databaseId,status,conclusion \
            --jq '.[0].databaseId' || true)
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "::warning::No pm-e2e run found for this commit. Falling back to local build."
            echo "fallback=true" >> $GITHUB_OUTPUT
          else
            echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
            echo "Found pm-e2e run: $RUN_ID"
          fi

      - name: Download utoo from pm-e2e (linux)
        if: matrix.platform == 'linux' && steps.pme2e.outputs.fallback != 'true'
        uses: actions/download-artifact@v4
        with:
          name: utoo-linux-x64
          path: dist
          run-id: ${{ steps.pme2e.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Fallback: pm-e2e didn't run for this commit (e.g. workflow_dispatch
      # without a PR / commit message scope mismatch) — build utoo locally.
      - name: Build utoo locally (linux fallback)
        if: matrix.platform == 'linux' && steps.pme2e.outputs.fallback == 'true'
        run: |
          mkdir -p dist
          cargo build --release --bin utoo -p utoo-pm
          cp target/release/utoo dist/utoo

      # Mac: utoo built by build-manifest-bench job in this workflow.
      - name: Download utoo binary (mac)
        if: matrix.platform == 'mac'
        uses: actions/download-artifact@v4
        with:
          name: utoo-mac-bench-phases
          path: dist

      - name: Download manifest-bench binary
        uses: actions/download-artifact@v4
        with:
          name: manifest-bench-${{ matrix.platform }}
          path: dist

      - name: Install utoo
        run: |
          chmod +x dist/utoo dist/manifest-bench
          echo "$GITHUB_WORKSPACE/dist" >> $GITHUB_PATH
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # hyperfine + GNU time available via OS package manager. tcpdump
      # only needed for pcap step (linux only — sudo + raw sockets not
      # generally available on macos GH runners).
      - name: Install bench tools (linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y hyperfine time tcpdump dnsutils
      - name: Install bench tools (mac)
        if: matrix.platform == 'mac'
        run: |
          brew install hyperfine
          # macOS has /usr/bin/time built-in; pm-bench-phases.sh's metrics
          # wrapper uses `time -v` (GNU). Install gnu-time and alias.
          brew install gnu-time
          # symlink so `time` in scripts hits gnu-time
          mkdir -p "$HOME/bin"
          ln -sf "$(brew --prefix gnu-time)/bin/gtime" "$HOME/bin/time"
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Verify tools
        run: |
          hyperfine --version
          utoo --version
          bun --version

      # ============================================================
      # Helper: wipe everything between registry runs so cache + state
      # from the previous registry doesn't leak into the next one.
      # The PROJECT clone is removed too — the bench script re-clones.
      # ============================================================
      - name: Define cache wipe function
        run: |
          cat > /tmp/wipe-bench-state.sh <<'WIPE'
          #!/usr/bin/env bash
          # Wipe ALL bench state — caches, project clone, results, lockfiles.
          # Used between registry runs so the second one starts truly cold.
          rm -rf /tmp/pm-bench /tmp/pm-bench-results /tmp/pm-bench-output \
                 /tmp/utoo-bench-cache /tmp/bun-bench-cache \
                 ~/.bun/install/cache ~/.cache/nm 2>/dev/null || true
          mkdir -p /tmp/pm-bench-output
          WIPE
          chmod +x /tmp/wipe-bench-state.sh

      # ------------------------------------------------------------
      # Run 1: npmjs.org (the primary upstream)
      # ------------------------------------------------------------
      - name: Wipe bench state before npmjs
        run: bash /tmp/wipe-bench-state.sh

      - name: Run phase-isolated benchmark · npmjs
        env:
          PROJECT: ${{ github.event.inputs.project || 'ant-design' }}
          REGISTRY: 'https://registry.npmjs.org'
          BENCH_RUNS: ${{ github.event.inputs.runs || '3' }}
          PM_LIST: 'utoo,bun'
        run: |
          chmod +x e2e/pm-bench-phases.sh
          bash e2e/pm-bench-phases.sh 2>&1 | tee /tmp/pm-bench-output/bench-phases-npmjs.log

      - name: Standalone manifest-bench · npmjs
        env:
          REGISTRY: 'https://registry.npmjs.org'
          PROJECT: ${{ github.event.inputs.project || 'ant-design' }}
        run: bash .github/scripts/run-manifest-bench.sh 2>&1 | tee /tmp/pm-bench-output/manifest-bench-npmjs.log

      # ------------------------------------------------------------
      # Run 2: npmmirror.com (Asia-Pacific, semver-supporting registry)
      # ------------------------------------------------------------
      # Save the npmjs logs out of /tmp/pm-bench-output before wipe
      # (the wipe also clears the output dir for cleanliness).
      - name: Stash npmjs logs and wipe state before npmmirror
        run: |
          mkdir -p /tmp/bench-logs-stash
          cp -r /tmp/pm-bench-output/. /tmp/bench-logs-stash/ 2>/dev/null || true
          bash /tmp/wipe-bench-state.sh
          mkdir -p /tmp/pm-bench-output
          cp -r /tmp/bench-logs-stash/. /tmp/pm-bench-output/ 2>/dev/null || true

      - name: Run phase-isolated benchmark · npmmirror
        env:
          PROJECT: ${{ github.event.inputs.project || 'ant-design' }}
          REGISTRY: 'https://registry.npmmirror.com'
          BENCH_RUNS: ${{ github.event.inputs.runs || '3' }}
          PM_LIST: 'utoo,bun'
        run: |
          mkdir -p /tmp/pm-bench-output
          bash e2e/pm-bench-phases.sh 2>&1 | tee /tmp/pm-bench-output/bench-phases-npmmirror.log

      - name: Standalone manifest-bench · npmmirror
        env:
          REGISTRY: 'https://registry.npmmirror.com'
          PROJECT: ${{ github.event.inputs.project || 'ant-design' }}
        run: bash .github/scripts/run-manifest-bench.sh 2>&1 | tee /tmp/pm-bench-output/manifest-bench-npmmirror.log

      # PCAP only on linux (mac runners lack tcpdump + raw socket perms).
      - name: Capture pcap (resolve phase, single run per PM)
        if: matrix.platform == 'linux'
        env:
          PROJECT: ${{ github.event.inputs.project || 'ant-design' }}
          REGISTRY: 'https://registry.npmjs.org'
        run: |
          chmod +x e2e/pm-bench-pcap.sh
          bash e2e/pm-bench-pcap.sh

      - name: Upload pcap artifact
        if: always() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: pm-bench-pcap
          path: /tmp/pm-bench-pcap
          retention-days: 3

      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-bench-logs-${{ matrix.platform }}
          path: /tmp/pm-bench-output
          retention-days: 7

      # Build the comment body from BOTH registry runs and BOTH phases'
      # output. Strips ANSI escape codes; pulls out per-phase summary
      # tables for each registry under a labeled section.
      - name: Build PR comment body
        if: always()
        run: |
          set -eu
          OUT=/tmp/pm-bench-output/pr_comment.md

          SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PLATFORM='${{ matrix.platform }}'
          OS='${{ matrix.os }}'

          {
            echo "## 📊 pm-bench-phases · \`$SHA\` · ${PLATFORM} (\`${OS}\`)"
            echo ""
            echo "[Workflow run]($RUN_URL) — ant-design"
            echo ""
          } > "$OUT"

          # Helper to extract `## p<N>_<name>` sections from a log file
          # and emit them under a labeled heading.
          render_log() {
            local label="$1"
            local file="$2"
            if [ ! -f "$file" ]; then
              echo "_${label}: no output captured._"
              echo ""
              return
            fi
            echo "### ${label}"
            echo ""
            local cleaned
            cleaned=$(mktemp)
            sed -E 's/\x1B\[[0-9;]*[a-zA-Z]//g' "$file" > "$cleaned"
            awk '
              /^## p[0-9]+_[a-z0-9_]+/ {
                if (in_section) print "```\n";
                in_section = 1;
                print "```";
                print $0;
                next;
              }
              /^## / && in_section {
                print "```\n";
                in_section = 0;
              }
              in_section { print }
              END { if (in_section) print "```" }
            ' "$cleaned"
            echo ""
            rm -f "$cleaned"
          }

          render_log "npmjs.org" /tmp/pm-bench-output/bench-phases-npmjs.log >> "$OUT"
          render_log "npmmirror.com" /tmp/pm-bench-output/bench-phases-npmmirror.log >> "$OUT"

          # Manifest-bench: include only the section markers + rep
          # summary lines so the comment doesn't balloon.
          {
            echo "### manifest-bench (HTTP-only fetch sweep)"
            echo ""
            for label in npmjs npmmirror; do
              mb_log="/tmp/pm-bench-output/manifest-bench-${label}.log"
              if [ -f "$mb_log" ]; then
                echo "**${label}**"
                echo ""
                echo '```'
                sed -E 's/\x1B\[[0-9;]*[a-zA-Z]//g' "$mb_log" \
                  | grep -E '^---|rep [12]\] n=' || echo '(no manifest-bench output)'
                echo '```'
                echo ""
              fi
            done
          } >> "$OUT"

      - name: Find Current PR
        id: findPr
        if: always()
        run: |
          PR_NUMBER=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number' || true)
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
              PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --state open --json number --jq '.[0].number' || true)
            fi
          fi
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # Each platform posts its own sticky comment (different `header`)
      # so linux + mac results live as two separate comments and don't
      # race / overwrite each other.
      - name: Post PR Comment
        if: always() && steps.findPr.outputs.number
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pm-bench-phases-${{ matrix.platform }}
          path: /tmp/pm-bench-output/pr_comment.md
          number: ${{ steps.findPr.outputs.number }}
          recreate: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
