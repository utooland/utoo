name: utoopm-bench-phases

# Phase-isolated benchmark. Triggered by `utoopm-build` completing —
# downloads each platform's `utoo` artifact, runs the bench across npmjs
# + npmmirror, and posts a sticky PR comment per platform with the
# results. Includes utoo@npm (latest published) as a baseline column
# alongside utoo (this branch) and bun (latest).
on:
  workflow_run:
    workflows: ["utoopm-build"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
  UPSTREAM_REPO: ${{ github.repository }}

jobs:
  bench-phases-linux:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check artifact exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HAS=$(gh api "repos/${UPSTREAM_REPO}/actions/runs/${UPSTREAM_RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "utoo-linux-x64" and .expired == false)] | length')
          if [ "$HAS" -eq 0 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::No utoo-linux-x64 artifact in pm-build run ${UPSTREAM_RUN_ID} — skipping linux bench-phases."
          fi
      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download utoo binary
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: utoo-linux-x64
          path: dist
          run-id: ${{ env.UPSTREAM_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install utoo
        if: steps.check.outputs.skip != 'true'
        run: |
          chmod +x dist/utoo
          echo "$GITHUB_WORKSPACE/dist" >> $GITHUB_PATH
      - name: Install bun
        if: steps.check.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install bench tools
        if: steps.check.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y hyperfine time
      - name: Install utoo@npm baseline
        # Install latest published utoo to a temp dir (NOT the global prefix)
        # so it doesn't shadow $GITHUB_WORKSPACE/dist/utoo on PATH. The bench
        # script invokes it via $UTOO_NPM_BIN absolute path. Points directly
        # at node_modules/utoo/bin/utoo (the package's `bin` field) — npm's
        # node_modules/.bin/ symlink isn't always created for local installs.
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/utoo-npm-pkg && cd /tmp/utoo-npm-pkg
          npm init -y >/dev/null
          npm install utoo --no-audit --no-fund --no-progress
          UTOO_NPM_BIN="$PWD/node_modules/utoo/bin/utoo"
          chmod +x "$UTOO_NPM_BIN"
          "$UTOO_NPM_BIN" --version
          echo "UTOO_NPM_BIN=$UTOO_NPM_BIN" >> $GITHUB_ENV
      - name: Verify tools
        if: steps.check.outputs.skip != 'true'
        run: |
          hyperfine --version
          utoo --version
          "$UTOO_NPM_BIN" --version
          bun --version
      - name: Define cache wipe function
        if: steps.check.outputs.skip != 'true'
        run: |
          cat > /tmp/wipe-bench-state.sh <<'WIPE'
          #!/usr/bin/env bash
          rm -rf /tmp/pm-bench /tmp/pm-bench-results /tmp/pm-bench-output \
                 /tmp/utoo-bench-cache /tmp/utoo-npm-bench-cache /tmp/bun-bench-cache \
                 ~/.bun/install/cache ~/.cache/nm 2>/dev/null || true
          mkdir -p /tmp/pm-bench-output
          WIPE
          chmod +x /tmp/wipe-bench-state.sh
      - name: Wipe bench state before npmjs
        if: steps.check.outputs.skip != 'true'
        run: bash /tmp/wipe-bench-state.sh
      - name: Run phase-isolated benchmark · npmjs
        if: steps.check.outputs.skip != 'true'
        env:
          PROJECT: 'ant-design'
          REGISTRY: 'https://registry.npmjs.org'
          BENCH_RUNS: '3'
          PM_LIST: 'utoo,utoo-npm,bun'
        run: |
          chmod +x bench/pm-bench-phases.sh
          bash bench/pm-bench-phases.sh 2>&1 | tee /tmp/pm-bench-output/bench-phases-npmjs.log
      - name: Stash npmjs logs and wipe state before npmmirror
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/bench-logs-stash
          cp -r /tmp/pm-bench-output/. /tmp/bench-logs-stash/ 2>/dev/null || true
          bash /tmp/wipe-bench-state.sh
          mkdir -p /tmp/pm-bench-output
          cp -r /tmp/bench-logs-stash/. /tmp/pm-bench-output/ 2>/dev/null || true
      - name: Run phase-isolated benchmark · npmmirror
        if: steps.check.outputs.skip != 'true'
        env:
          PROJECT: 'ant-design'
          REGISTRY: 'https://registry.npmmirror.com'
          BENCH_RUNS: '3'
          PM_LIST: 'utoo,utoo-npm,bun'
        run: |
          mkdir -p /tmp/pm-bench-output
          bash bench/pm-bench-phases.sh 2>&1 | tee /tmp/pm-bench-output/bench-phases-npmmirror.log
      - name: Upload bench logs
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pm-bench-logs-linux
          path: /tmp/pm-bench-output
          retention-days: 7
      - name: Build PR comment body
        if: always() && steps.check.outputs.skip != 'true'
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/render-bench-phases-comment.sh linux ubuntu-latest
      - name: Find Current PR
        id: findPr
        if: always() && steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Try the upstream workflow_run's pull_requests payload first
          # (only populated for same-repo PRs). Fall back to PR list lookup.
          PR_NUMBER=""
          PRS_JSON='${{ toJson(github.event.workflow_run.pull_requests) }}'
          PR_NUMBER=$(echo "$PRS_JSON" | jq -r '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --state open --json number --jq '.[0].number' || true)
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh pr list --search "${{ github.event.workflow_run.head_sha }}" --state open --json number --jq '.[0].number' || true)
          fi
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
      - name: Post PR Comment
        if: always() && steps.check.outputs.skip != 'true' && steps.findPr.outputs.number
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pm-bench-phases-linux
          path: /tmp/pm-bench-output/pr_comment.md
          number: ${{ steps.findPr.outputs.number }}
          recreate: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bench-phases-mac:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check artifact exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HAS=$(gh api "repos/${UPSTREAM_REPO}/actions/runs/${UPSTREAM_RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "utoo-mac-arm64" and .expired == false)] | length')
          if [ "$HAS" -eq 0 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::No utoo-mac-arm64 artifact in pm-build run ${UPSTREAM_RUN_ID} — skipping mac bench-phases."
          fi
      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download utoo binary
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: utoo-mac-arm64
          path: dist
          run-id: ${{ env.UPSTREAM_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install utoo
        if: steps.check.outputs.skip != 'true'
        run: |
          chmod +x dist/utoo
          echo "$GITHUB_WORKSPACE/dist" >> $GITHUB_PATH
      - name: Install bun
        if: steps.check.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install bench tools
        # macOS /usr/bin/time isn't GNU; bench/pm-bench-phases.sh uses
        # `time -v`. Install gnu-time and shadow `time` with a $HOME/bin
        # symlink earlier on PATH.
        if: steps.check.outputs.skip != 'true'
        run: |
          brew install hyperfine gnu-time
          mkdir -p "$HOME/bin"
          ln -sf "$(brew --prefix gnu-time)/bin/gtime" "$HOME/bin/time"
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Install utoo@npm baseline
        # See linux job — same rationale.
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/utoo-npm-pkg && cd /tmp/utoo-npm-pkg
          npm init -y >/dev/null
          npm install utoo --no-audit --no-fund --no-progress
          UTOO_NPM_BIN="$PWD/node_modules/utoo/bin/utoo"
          chmod +x "$UTOO_NPM_BIN"
          "$UTOO_NPM_BIN" --version
          echo "UTOO_NPM_BIN=$UTOO_NPM_BIN" >> $GITHUB_ENV
      - name: Verify tools
        if: steps.check.outputs.skip != 'true'
        run: |
          hyperfine --version
          utoo --version
          "$UTOO_NPM_BIN" --version
          bun --version
      - name: Define cache wipe function
        if: steps.check.outputs.skip != 'true'
        run: |
          cat > /tmp/wipe-bench-state.sh <<'WIPE'
          #!/usr/bin/env bash
          rm -rf /tmp/pm-bench /tmp/pm-bench-results /tmp/pm-bench-output \
                 /tmp/utoo-bench-cache /tmp/utoo-npm-bench-cache /tmp/bun-bench-cache \
                 ~/.bun/install/cache ~/.cache/nm 2>/dev/null || true
          mkdir -p /tmp/pm-bench-output
          WIPE
          chmod +x /tmp/wipe-bench-state.sh
      - name: Wipe bench state before npmjs
        if: steps.check.outputs.skip != 'true'
        run: bash /tmp/wipe-bench-state.sh
      - name: Run phase-isolated benchmark · npmjs
        if: steps.check.outputs.skip != 'true'
        env:
          PROJECT: 'ant-design'
          REGISTRY: 'https://registry.npmjs.org'
          BENCH_RUNS: '3'
          PM_LIST: 'utoo,utoo-npm,bun'
        run: |
          chmod +x bench/pm-bench-phases.sh
          bash bench/pm-bench-phases.sh 2>&1 | tee /tmp/pm-bench-output/bench-phases-npmjs.log
      - name: Stash npmjs logs and wipe state before npmmirror
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/bench-logs-stash
          cp -r /tmp/pm-bench-output/. /tmp/bench-logs-stash/ 2>/dev/null || true
          bash /tmp/wipe-bench-state.sh
          mkdir -p /tmp/pm-bench-output
          cp -r /tmp/bench-logs-stash/. /tmp/pm-bench-output/ 2>/dev/null || true
      - name: Run phase-isolated benchmark · npmmirror
        if: steps.check.outputs.skip != 'true'
        env:
          PROJECT: 'ant-design'
          REGISTRY: 'https://registry.npmmirror.com'
          BENCH_RUNS: '3'
          PM_LIST: 'utoo,utoo-npm,bun'
        run: |
          mkdir -p /tmp/pm-bench-output
          bash bench/pm-bench-phases.sh 2>&1 | tee /tmp/pm-bench-output/bench-phases-npmmirror.log
      - name: Upload bench logs
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pm-bench-logs-mac
          path: /tmp/pm-bench-output
          retention-days: 7
      - name: Build PR comment body
        if: always() && steps.check.outputs.skip != 'true'
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/render-bench-phases-comment.sh mac macos-latest
      - name: Find Current PR
        id: findPr
        if: always() && steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=""
          PRS_JSON='${{ toJson(github.event.workflow_run.pull_requests) }}'
          PR_NUMBER=$(echo "$PRS_JSON" | jq -r '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --state open --json number --jq '.[0].number' || true)
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh pr list --search "${{ github.event.workflow_run.head_sha }}" --state open --json number --jq '.[0].number' || true)
          fi
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
      - name: Post PR Comment
        if: always() && steps.check.outputs.skip != 'true' && steps.findPr.outputs.number
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pm-bench-phases-mac
          path: /tmp/pm-bench-output/pr_comment.md
          number: ${{ steps.findPr.outputs.number }}
          recreate: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
