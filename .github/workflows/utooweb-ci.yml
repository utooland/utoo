name: utooweb-ci

on:
  push:
    branches: ["next"]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: utooweb-ci-build-and-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init git submodules
        run: git submodule update --init --recursive --depth 1
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-02
          targets: wasm32-unknown-unknown
          components: rust-src
      # - name: Cache cargo
      #   uses: Swatinem/rust-cache@v2
      #   with:
      #     shared-key: utooweb-ci
      - name: Setup Utoo
        uses: utooland/setup-utoo@v1

      - name: Install dependencies
        run: |
          utoo install
          npm install binaryen@123.0.0 --global
      - name: Install wasm-bindgen-cli
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: '0.2.108'
      - name: Build @utoo/web
        run: |
          npm run build:local --workspace @utoo/web
          ls packages/utoo-web/esm/utoo
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run utooweb demo e2e
        run: |
          set -euo pipefail

          npm run start --workspace utooweb-demo > /tmp/utooweb-demo.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8081 >/dev/null 2>&1; then
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/utooweb-demo.log
              exit 1
            fi

            if [ "$i" -eq 120 ]; then
              cat /tmp/utooweb-demo.log
              echo "Timed out waiting for utooweb-demo"
              exit 1
            fi

            sleep 1
          done

          npm run test:e2e:utooweb
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: utooweb-e2e-artifacts
          path: |
            playwright-report
            test-results
            /tmp/utooweb-demo.log

  success:
    name: utooweb-ci-success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
    steps:
      - name: Check success
        run: |
          if [ "${{ needs.build.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "cancelled" ]; then
            echo "Tests failed or were cancelled"
            exit 1
          else
            echo "Tests passed or were skipped"
          fi
