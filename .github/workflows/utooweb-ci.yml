name: utooweb-ci

on:
  push:
    branches: ["next"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: utooweb-ci-build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Add SSH private keys for submodule repositories
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: |
            ${{ secrets.CI_SUBMODULE }}
      - name: Init git submodules
        run: git submodule update --init --depth 1
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install
          npm install binaryen@123.0.0 --global
          cargo install -f wasm-bindgen-cli --version 0.2.104
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src --toolchain nightly-2025-10-27-x86_64-unknown-linux-gnu
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-10-27
      - name: Build WASM
        run: |
          npm run build:local --workspace=@utoo/web
          ls packages/utoo-web/esm/utoo
