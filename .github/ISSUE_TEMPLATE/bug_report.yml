name: 🐛 Bug Report
description: Report a possible bug or regression with Utoo
title: "🐛 <TITLE>"
labels: [ "S-Bug-confirmed" ]
type: Bug
body:
  - type: markdown
    attributes:
      value: Thank you for submitting the bug! We'll try to triage it ASAP!
  - type: markdown
    attributes:
      value: |
        Bug reports that don't follow this template will be closed.
        Please provide a clear and concise description of what the bug is.
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: What happened?
      description: |
        Provide a detailed list of steps that reproduce the issue
        The more information and included steps, the quicker your report can be triaged and addressed!

      placeholder: |
        1.
        2.
    validations:
      required: false
  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: Describe what you expected to happen.
      placeholder: It should not throw an error.
    validations:
      required: false